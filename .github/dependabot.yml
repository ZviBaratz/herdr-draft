# Dependabot keeps the two things this repository pins current: Go modules,
# and the GitHub Actions in check.yml, which are pinned by commit SHA rather
# than by tag (a tag is mutable, and the workflow runs on every push).
# Dependabot understands SHA pins and updates the SHA and its version comment
# together.
#
# Read a gomod PR's go.mod diff before merging it. herdr runs `go build` on
# the USER's machine at install time, so a dependency that needs a newer Go
# and drags this module's `go` line up with it raises the floor for everyone
# installing the plugin -- the reason CONTRIBUTING.md gives for keeping
# staticcheck out of go.mod. Such an update waits until the floor moves on
# purpose.
#
# Monthly and grouped, because every update is a PR that has to pass the
# whole gate on two platforms, and a burst of single-dependency PRs costs
# more review than the drift it prevents.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go-modules:
        patterns: ["*"]
    # The golang.org/x modules support the latest two Go releases, and each
    # new Go release moves their `go` line up with it -- so their minor
    # updates are the ones that raise this module's floor. At Go 1.25.0,
    # x/text v0.42.0 and x/sync v0.23.0 both need Go 1.26 (#329 was that
    # PR). They are v0.x, so a minor update is the part that moves:
    # Dependabot reads v0.41.0 -> v0.42.0 as semver-minor and still offers
    # v0.41.x patches. Take them deliberately when the floor moves on
    # purpose, and remove this ignore then. A charm update can still pull a
    # newer x module in as its own requirement, which is what the go.mod
    # diff check above is for.
    ignore:
      - dependency-name: "golang.org/x/*"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
